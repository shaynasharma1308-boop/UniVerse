<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Faculty - UniVerse</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav>
            <h2 class="logo">UniVerse.</h2>

            <ul>
                <li><a href="admin-dashboard.html">Dashboard</a></li>
                <li><a href="index.html">Home</a></li>
            </ul>
        </nav>
    </header>

    <section class="dashboard">

        <div class="dashboard-heading">
            <p class="tagline">ADMIN PORTAL</p>
            <h1>Manage Faculty</h1>
            <p>Add and manage university faculty records.</p>
        </div>

        <div class="admin-form">

            <h2>Add New Faculty</h2>

            <form id="facultyForm">

                <input type="number" id="facultyID"
                    placeholder="Faculty ID" required>

                <input type="text" id="facultyName"
                    placeholder="Faculty Name" required>

                <input type="text" id="facultyDepartment"
                    placeholder="Department" required>

                <input type="text" id="facultyDesignation"
                    placeholder="Designation" required>

                <button type="submit">Add Faculty</button>

            </form>

        </div>

        <div class="club-management">

            <h2>Existing Faculty Members</h2>

            <input type="text" id="adminFacultySearch"
                placeholder="Search faculty...">

            <div id="adminFacultyList"></div>

        </div>

    </section>

    <footer>
        <p>© 2026 UniVerse. All Rights Reserved.</p>
    </footer>

    
<script>
document.addEventListener("DOMContentLoaded", function() {

    const form = document.getElementById("facultyForm");
    const facultyList = document.getElementById("adminFacultyList");
    const searchBox = document.getElementById("adminFacultySearch");

    let faculty = JSON.parse(localStorage.getItem("faculty")) ||
     [
        
        {
            id: 201,
            name: "Dr. Anil Sharma",
            department: "CSE",
            designation: "Professor"
        },
        {
            id: 202,
            name: "Dr. Priya Verma",
            department: "ECE",
            designation: "Associate Professor"
        },
        {
            id: 203,
            name: "Mr. Rahul Mehta",
            department: "Civil",
            designation: "Assistant Professor"
        },
        {
            id: 204,
            name: "Dr. Neha Gupta",
            department: "CSE",
            designation: "Associate Professor"
        }
    ];

    function displayFaculty(searchValue = "") {

        facultyList.innerHTML = "";

        let found = 0;

        faculty.forEach(function(member) {

            let details = (
                member.name + " " +
                member.department + " " +
                member.designation + " " +
                member.id
            ).toLowerCase();

            if (details.includes(searchValue.toLowerCase())) {

                found++;

                let card = document.createElement("div");
                card.className = "admin-club-item";

                let info = document.createElement("div");

                let heading = document.createElement("h3");
                heading.textContent = member.name;

                let id = document.createElement("p");
                id.textContent = "Faculty ID: " + member.id;

                let department = document.createElement("p");
                department.textContent = "Department: " + member.department;

                let designation = document.createElement("p");
                designation.textContent = "Designation: " + member.designation;

                info.appendChild(heading);
                info.appendChild(id);
                info.appendChild(department);
                info.appendChild(designation);

                let deleteButton = document.createElement("button");
                deleteButton.textContent = "Delete";

                deleteButton.addEventListener("click", function() {

                    faculty = faculty.filter(function(f) {
                        return f.id !== member.id;
                    });

                    localStorage.setItem("faculty", JSON.stringify(faculty));

                    displayFaculty(searchBox.value);

                });

                card.appendChild(info);
                card.appendChild(deleteButton);

                facultyList.appendChild(card);
            }
        });

        if (found === 0) {
            facultyList.textContent = "No faculty members found.";
        }
    }

    form.addEventListener("submit", function(event) {

        event.preventDefault();

        let id = Number(document.getElementById("facultyID").value);
        let name = document.getElementById("facultyName").value.trim();
        let department = document.getElementById("facultyDepartment").value.trim();
        let designation = document.getElementById("facultyDesignation").value.trim();

        if (faculty.some(function(f) {
            return f.id === id;
        })) {
            alert("Faculty ID already exists!");
            return;
        }

        faculty.push({
            id: id,
            name: name,
            department: department,
            designation: designation
        });

        localStorage.setItem("faculty", JSON.stringify(faculty));

        form.reset();

        displayFaculty(searchBox.value);

        alert("Faculty added successfully!");

    });

    searchBox.addEventListener("input", function() {
        displayFaculty(searchBox.value);
    });

    if (!localStorage.getItem("faculty")) {
        localStorage.setItem("faculty", JSON.stringify(faculty));
    }

    displayFaculty();

});
</script>
</body>
</html>
