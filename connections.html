
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club-Faculty Connections - UniVerse</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav>
            <h2 class="logo">UniVerse.</h2>
            <ul>
                <li><a href="student-dashboard.html">Dashboard</a></li>
                <li><a href="index.html">Home</a></li>
            </ul>
        </nav>
    </header>

    <section class="dashboard">

        <div class="dashboard-heading">
            <p class="tagline">STUDENT PORTAL</p>
            <h1>Club-Faculty Connections</h1>
            <p>Explore the faculty coordinators assigned to university clubs.</p>
        </div>

        <div class="club-management">
            <h2>Club Connections</h2>
            <div id="connectionList"></div>
        </div>

    </section>

    <footer>
        <p>© 2026 UniVerse. All Rights Reserved.</p>
    </footer>

    
<script>
document.addEventListener("DOMContentLoaded", function() {

    const clubs = JSON.parse(localStorage.getItem("clubs")) || [];
    const faculty = JSON.parse(localStorage.getItem("faculty")) || [];
    const assignments = JSON.parse(localStorage.getItem("assignments")) || [];

    const connectionList = document.getElementById("connectionList");

    let found = 0;

    assignments.forEach(function(item) {

        let club = clubs.find(function(c) {
            return Number(c.id) === Number(item.clubID);
        });

        let member = faculty.find(function(f) {
            return Number(f.id) === Number(item.facultyID);
        });

        if (!club || !member) {
            return;
        }

        found++;

        let card = document.createElement("div");
        card.className = "assignment-item";

        let details = document.createElement("div");

        let heading = document.createElement("h3");
        heading.textContent = club.name;

        let clubID = document.createElement("p");
        clubID.textContent = "Club ID: " + club.id;

        let coordinator = document.createElement("p");
        coordinator.textContent = "Faculty Coordinator: " + member.name;

        let department = document.createElement("p");
        department.textContent = "Department: " + member.department;

        details.appendChild(heading);
        details.appendChild(clubID);
        details.appendChild(coordinator);
        details.appendChild(department);

        card.appendChild(details);

        connectionList.appendChild(card);

    });

    if (found === 0) {
        connectionList.textContent = "No faculty coordinators have been assigned yet.";
    }

});
</script>

</body>
</html>
