
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - UniVerse</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <nav>
            <h2 class="logo">UniVerse.</h2>
            <a href="index.html" style="color:white; text-decoration:none;">
                Back to Home
            </a>
        </nav>
    </header>

    <section class="login-section">

        <div class="login-box">

            <h1>Welcome to UniVerse</h1>

            <p>Choose how you want to continue.</p>

            <div class="login-options">

                <div class="login-card">
                    <h2>Student Login</h2>
                    <p>Access clubs, faculty information and university updates.</p>
                    <button onclick="window.location.href='student-login.html'">
    Continue as Student
</button>
                </div>

                <div class="login-card">
                    <h2>Admin Login</h2>
                    <p>Manage clubs, faculty records and university information.</p>
                    <button onclick="window.location.href='admin-login.html'">
    Continue as Admin
</button>
                </div>

            </div>

        </div>

    </section>

</body>
</html>
